name: IDRX
description: >-
  IDRX is a stablecoin pegged 1:1 to the Indonesian Rupiah (IDR), issued by a
  regulated Indonesian entity and available across multiple EVM chains and Solana.
  Its REST API lets business (organization) accounts onboard KYC-verified users,
  register bank accounts, and process mint (fiat IDR -> IDRX / USDT on-chain),
  redeem (IDRX -> fiat IDR to a bank account), and bridge (cross-chain) transactions,
  plus query swap rates, fees, supported bank methods, and transaction history.
  Requests are authenticated with an API key and an HMAC-SHA256 request signature,
  and settlement is confirmed via single-delivery webhooks or transaction-history
  polling. IDRX is a portfolio company of a16z (crypto).
